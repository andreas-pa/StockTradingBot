# Trading bot settings. Edit these values to change what the bot trades.

# Stock tickers to trade. The bot checks each one on every run.
symbols:
  - AAPL
  - ABBV
  - AMD
  - AMZN
  - AVGO
  - GOOGL
  - INTC
  - JNJ
  - JPM
  - LLY
  - MA
  - META
  - MSFT
  - MU
  - NVDA
  - PLTR
  - TSLA
  - V
  - WMT
  - XOM

# Moving average periods, in trading days. The short period must be smaller.
short_window: 20
long_window: 50

# When to buy and sell:
#   crossover - buy only on the day the short average crosses above the long one.
#               Sell at the next run while it is below, so missed days are caught up.
#   state     - hold whenever the short average is above the long one. Buys at the
#               next run if not holding, so missed days are caught up.
entry_mode: crossover

# A signal only counts after it has held for this many days in a row. 1 = no wait.
confirm_days: 1

# A signal only counts when the averages differ by at least this percentage. 0 = off.
min_gap_pct: 0

# Sell when the price closes this percentage below its highest close since the buy. 0 = off.
trailing_stop_pct: 0

# Order size:
#   shares  - buy trade_size shares on each buy
#   dollars - buy as many whole shares as trade_dollars allows
sizing: shares
trade_size: 10
trade_dollars: 1000

# Number of past trading days to fetch from yfinance.
# Must be greater than long_window + confirm_days.
history_days: 100
